<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<title>ピコの電線ラン</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
</head><body>
<style>
/* Layout: one arcade cabinet — game screen on top, touch pad underneath */
:root{
  color-scheme: dark;
  --night:#13102a;
  --panel:#1e1940;
  --edge:#3b3373;
  --press:#2c2560;
  --spark:#ffd23f;
  --spark-deep:#3a2c0e;
  --mint:#7ee0c3;
  --text:#ece8ff;
  --dim:#a29ccf;
  --pixel:"DotGothic16","Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic",monospace;
}
html,body{height:100%}
body{background:var(--night);color:var(--text);font-family:var(--pixel);-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.wrap{max-width:900px;margin:0 auto;padding-block:12px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;flex-wrap:wrap}
h1{font-size:1.25rem;margin:0;font-weight:400;letter-spacing:.06em;color:var(--spark);text-wrap:balance}
h1 small{color:var(--dim);font-size:.75rem;margin-left:.6em;letter-spacing:.04em}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.tool{font:inherit;font-size:.85rem;color:var(--text);background:var(--panel);border:2px solid var(--edge);border-radius:6px;padding:6px 12px;cursor:pointer}
.tool[aria-pressed="false"]{color:var(--dim)}
.tool:hover{border-color:var(--dim)}
.tool:focus-visible,.key:focus-visible{outline:2px solid var(--spark);outline-offset:2px}
.stage{position:relative;display:flex;flex-direction:column;gap:14px}
.screen{width:100%;max-width:100%;aspect-ratio:5/3;margin:0 auto;background:#0d0b1c;border:3px solid var(--edge);border-radius:8px;overflow:hidden;box-shadow:0 0 0 3px #0b0918,0 12px 30px rgba(0,0,0,.45)}
canvas{display:block;width:100%;height:100%;image-rendering:crisp-edges;image-rendering:pixelated;touch-action:none;cursor:pointer}
.pad{display:none;justify-content:space-between;align-items:center;gap:16px;user-select:none;-webkit-user-select:none;touch-action:none}
.cluster{display:flex;gap:12px;align-items:center}
.key{width:70px;height:70px;border-radius:50%;border:3px solid var(--edge);background:var(--panel);color:var(--text);font:inherit;font-size:1.3rem;line-height:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0;touch-action:none;cursor:pointer;-webkit-user-select:none;user-select:none}
.key small{font-size:.6rem;color:var(--dim)}
.key.dir{border-radius:14px;width:74px;height:62px}
.key svg{width:22px;height:22px;fill:currentColor}
.key.a{background:var(--spark-deep);border-color:var(--spark);color:var(--spark)}
.key.on{background:var(--press);border-color:var(--mint);transform:translateY(2px)}
.key.a.on{background:var(--spark);color:var(--night)}
.key.a.on small{color:var(--night)}
.hint{color:var(--dim);font-size:.85rem;line-height:1.8;display:flex;flex-wrap:wrap;gap:2px 18px;margin:0;padding:0;list-style:none}
kbd{font-family:inherit;border:1px solid var(--edge);border-bottom-width:2px;border-radius:4px;padding:0 6px;background:var(--panel);color:var(--text)}
.forms{display:flex;flex-wrap:wrap;gap:8px 20px;margin:0;padding:10px 14px;list-style:none;border:2px solid var(--edge);border-radius:8px;background:var(--panel);font-size:.85rem;line-height:1.6}
.forms b{color:var(--spark);font-weight:400}
.forms span{color:var(--dim)}
@media (hover:none),(pointer:coarse){ .pad{display:flex} .hint{display:none} }
@media (pointer:coarse) and (orientation:landscape) and (max-height:520px){
  .wrap{padding-block:4px;max-width:none}
  .top,.forms{display:none}
  .screen{width:min(100%,calc((100dvh - 16px) * 5 / 3))}
  .pad{position:absolute;left:0;right:0;bottom:10px;padding-inline:10px;pointer-events:none}
  .pad .key{pointer-events:auto;opacity:.6}
}
</style>

<div class="wrap">
  <div class="top">
    <h1>ピコの電線ラン<small>全3ステージ</small></h1>
    <div class="tools">
      <button class="tool" id="bgmBtn" type="button" aria-pressed="true">BGM：オン</button>
      <button class="tool" id="sfxBtn" type="button" aria-pressed="true">効果音：オン</button>
      <button class="tool" id="pauseBtn" type="button">一時停止</button>
    </div>
  </div>
  <div class="stage">
    <div class="screen"><canvas id="game" aria-label="ピコの電線ラン ゲーム画面"></canvas></div>
    <div class="pad" id="pad">
      <div class="cluster">
        <button class="key dir" id="kLeft" data-k="left" type="button" aria-label="左へ移動"><svg viewBox="0 0 24 24"><path d="M16 4 L6 12 L16 20 Z"/></svg></button>
        <button class="key dir" id="kRight" data-k="right" type="button" aria-label="右へ移動"><svg viewBox="0 0 24 24"><path d="M8 4 L18 12 L8 20 Z"/></svg></button>
      </div>
      <div class="cluster">
        <button class="key" id="kB" data-k="b" type="button" aria-label="ダッシュ・放電">B<small>ダッシュ</small></button>
        <button class="key a" id="kA" data-k="jump" type="button" aria-label="ジャンプ">A<small>ジャンプ</small></button>
      </div>
    </div>
  </div>
  <ul class="hint">
    <li><kbd>←</kbd> <kbd>→</kbd> 移動（タイトルではステージ選択）</li>
    <li><kbd>Z</kbd> / <kbd>Space</kbd> ジャンプ（長押しで高く）</li>
    <li><kbd>X</kbd> / <kbd>Shift</kbd> ダッシュ、ギガは放電</li>
    <li><kbd>P</kbd> 一時停止</li>
    <li>Xboxコントローラー：スティック/十字キー 移動、<kbd>A</kbd> ジャンプ、<kbd>X</kbd>/<kbd>B</kbd> ダッシュ・放電、メニューボタン 一時停止</li>
    <li>Switchコントローラー：スティック/十字キー 移動、<kbd>A</kbd>/<kbd>B</kbd> ジャンプ、<kbd>X</kbd>/<kbd>Y</kbd> ダッシュ・放電、<kbd>+</kbd>/<kbd>−</kbd> 一時停止</li>
  </ul>
  <ul class="forms" aria-label="進化">
    <li><b>ピコ</b> <span>1回当たるとミス</span></li>
    <li><b>メガ</b> <span>電池で進化。レンガを壊せる</span></li>
    <li><b>ギガ</b> <span>雷コアで進化。Bで放電</span></li>
  </ul>
</div>

<script>
(function(){
'use strict';
const cvs=document.getElementById('game');
const ctx=cvs.getContext('2d');
const W=400,H=240,T=16,ROWS=15;
let COLS=212,GOALX=202,CHECK_TX=100;
cvs.width=W*2; cvs.height=H*2;
const reduceMotion=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
function resetTransform(){ctx.setTransform(2,0,0,2,0,0);ctx.imageSmoothingEnabled=false;}
resetTransform();

/* ---------- pixel helpers ---------- */
function makeCanvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function fromRows(rows,pal){const w=rows[0].length,h=rows.length,c=makeCanvas(w,h),x=c.getContext('2d');for(let j=0;j<h;j++)for(let i=0;i<w;i++){const col=pal[rows[j][i]];if(col){x.fillStyle=col;x.fillRect(i,j,1,1);}}return c;}
function mirror(src){const c=makeCanvas(src.width,src.height),x=c.getContext('2d');x.translate(src.width,0);x.scale(-1,1);x.drawImage(src,0,0);return c;}
function paint(w,h,fn){const c=makeCanvas(w,h),x=c.getContext('2d');fn((col,a,b,cw=1,ch=1)=>{x.fillStyle=col;x.fillRect(a,b,cw,ch);},x);return c;}

/* ---------- hero: Pico → Mega → Giga (original design, named after SI prefixes) ---------- */
const FORM_NAMES=['ピコ','メガ','ギガ'];
const PICO_HEAD=[
"....y.....y.....",
"....k.....k.....",
"....k.....k.....",
"...kkkkkkkkk....",
"..kwwwwwwwwwk...",
".kwwwwwwwwwwwk..",
".kwwhewwwhewwk..",
".kwweewwweewwk..",
".kwwwwwkwwwwwk..",
".kwwwwwwwwwwwkgg",
".kwwbbbbbbbwwkg.",
"..kwbbbbbbbwkg..",
"..kwwbbbbbwwk...",
"...kkwwwwwkk...."];
const PICO_LEGS={
 idle:["...ffk...kff....","..fff.....fff..."],
 run1:["..ffk....kf.....",".ff........ff..."],
 run2:["....fk..kff.....","....ff..ff......"],
 jump:["..fk.....kf.....","................"]};
const BIG_MID=[
"...kkkkkkkkk....",
"..kwwwwwwwwwk...",
".kwwwwwwwwwwwk..",
".kwwhewwwhewwk..",
".kwweewwweewwk..",
".kwwwwwkkwwwwk..",
".kwwwwwwwwwwwk..",
"..kmmmmmmmmmk...",
".kwwwwwwwwwwwk..",
"kwkbbbbbbbbbkwk.",
"kwkbbbbbbbbbkwkg",
".kkbbbbbbbbbkkgg",
"..kbbbbbbbbbk.g.",
"..kwbbbbbbbwk.g.",
"..kwwwwwwwwwkgg.",
"...kwwwwwwwk....",
"....kkkkkkk....."];
const MEGA_TOP=["...yy.....yy....","....k.....k.....","....k.....k....."];
const GIGA_TOP=["..y....y...y....","...k...k..k.....","....k..k.k......"];
const BIG_LEGS={
 idle:["....fk...kf.....","....fk...kf.....","...ffk...kff....","..fff.....fff..."],
 run1:["....fk...kf.....","...fk.....kf....","..ffk......kf...",".ff.........ff.."],
 run2:["....fk..kf......",".....fkkf.......",".....ffff.......","....ff..ff......"],
 jump:["...fk.....kf....","..fk.......kf...","..f.........f...","................"]};
function gigaMid(){const m=BIG_MID.slice();m[10]="kwkbbbbzbbbbkwkg";m[11]=".kkbbbzzbbbbkkgg";m[12]="..kbbbbzbbbbk.g.";return m;}
const PAL=[
 {k:'#2b2550',w:'#fbf4e4',b:'#f1d3a6',e:'#1a1530',h:'#ffffff',y:'#ffd23f',g:'#9aa3b8',f:'#3d5aa8'},
 {k:'#2b2550',w:'#fbf4e4',b:'#f1d3a6',e:'#1a1530',h:'#ffffff',y:'#ffd23f',g:'#9aa3b8',f:'#3d5aa8',m:'#4fc9a5'},
 {k:'#16348a',w:'#e6f6ff',b:'#a9dcff',e:'#0f2150',h:'#ffffff',y:'#fff36b',g:'#ffd23f',f:'#1e5fc4',m:'#ffd23f',z:'#ffd23f'}];
function buildSet(top,legs,pal){const s={};for(const k in legs){const img=fromRows(top.concat(legs[k]),pal);s[k]=[img,mirror(img)];}return s;}
const SPR=[
 buildSet(PICO_HEAD,PICO_LEGS,PAL[0]),
 buildSet(MEGA_TOP.concat(BIG_MID),BIG_LEGS,PAL[1]),
 buildSet(GIGA_TOP.concat(gigaMid()),BIG_LEGS,PAL[2])];

/* ---------- tiles per theme ---------- */
const BOLT=[[8,3,2],[7,4,2],[6,5,2],[5,6,6],[8,7,2],[7,8,2],[6,9,2],[5,10,2]];
const THEMES={
 town:{ground:['#8a5432','#6b3d22','#a8693f','#3f9e66','#7fd59a','#2c7a4c'],brick:['#c45a32','#7a2f1a','#e98a5c'],stone:['#5b5e78','#8f93ab','#c4c7d9','#6f728c','#a9adc2']},
 under:{ground:['#2e3b5e','#232d4a','#3f4f78','#5a6f9a','#93a7d6','#3b4b78'],brick:['#3d6fb0','#1c3560','#6f9be0'],stone:['#232a46','#46527a','#7886aa','#36405f','#5d6a92']},
 sky:{ground:['#9a6a3c','#7a4f2a','#b98450','#57c27e','#9ae6b4','#348a57'],brick:['#d9762b','#8a3e0e','#f5a35f'],stone:['#4a5568','#a3aec0','#e3e9f2','#7f8ba0','#c3cbd8']}};
const tileCache={};
function makeTiles(name){
  if(tileCache[name])return tileCache[name];
  const th=THEMES[name],[dirt,dark,light,grass,grassHi,grassDark]=th.ground,TL={};
  TL.groundTop=paint(16,16,r=>{r(dirt,0,0,16,16);[[2,8],[9,10],[5,13],[12,14],[13,7],[1,11]].forEach(([a,b])=>r(dark,a,b,2,1));[[7,7],[11,12],[3,15]].forEach(([a,b])=>r(light,a,b));r(grass,0,0,16,4);r(grassHi,0,0,16,1);r(grassDark,0,4,16,1);[1,6,11].forEach(a=>r(grassDark,a,3,2,1));[0,4,9,14].forEach(a=>r(grass,a,4,2,1));});
  TL.ground=paint(16,16,r=>{r(dirt,0,0,16,16);[[2,3],[9,5],[5,10],[12,12],[13,1],[1,14],[7,8]].forEach(([a,b])=>r(dark,a,b,2,1));[[7,2],[11,9],[3,6]].forEach(([a,b])=>r(light,a,b));});
  const [bb,bm,bh]=th.brick;
  TL.brick=paint(16,16,r=>{r(bb,0,0,16,16);r(bm,0,7,16,1);r(bm,0,15,16,1);r(bm,7,0,1,7);r(bm,15,0,1,7);r(bm,3,8,1,7);r(bm,11,8,1,7);r(bh,0,0,7,1);r(bh,8,0,7,1);r(bh,0,8,3,1);r(bh,4,8,7,1);r(bh,12,8,3,1);});
  TL.brickColor=bb;
  const q=(fill,top,bot,border,bolt,shadow)=>paint(16,16,r=>{r(border,0,0,16,16);r(fill,1,1,14,14);r(top,1,1,14,1);r(bot,1,14,14,1);[[2,2],[13,2],[2,13],[13,13]].forEach(([a,b])=>r(border,a,b));if(bolt){BOLT.forEach(([a,b,w])=>r(shadow,a+1,b+1,w,1));BOLT.forEach(([a,b,w])=>r(bolt,a,b,w,1));}});
  TL.q=[q('#f2b134','#ffe08a','#c68a1c','#8a5a10','#fff4c2','#b0770b'),q('#ffc84a','#fff0b8','#d29a2a','#8a5a10','#ffffff','#c48612')];
  TL.used=q('#7d6a58','#9a8672','#5e4f41','#4a3c30',null,null);
  const [s0,s1,s2,s3,s4]=th.stone;
  TL.stone=paint(16,16,r=>{r(s0,0,0,16,16);r(s1,1,1,14,14);r(s2,1,1,14,1);r(s2,1,1,1,14);r(s3,2,14,13,1);r(s3,14,2,1,13);r(s4,4,5,3,1);r(s4,9,9,2,1);if(name==='sky'){[[3,3],[12,3],[3,12],[12,12]].forEach(([a,b])=>r(s3,a,b));}});
  tileCache[name]=TL;return TL;
}
let TILE=makeTiles('town');
const COIN_ROWS=[".....yy.","....yy..","...yy...","..yy....",".yyyyyy.","....yy..","...yy...","..yy....",".yy....."];
const COIN=fromRows(COIN_ROWS,{y:'#ffd23f'}),COIN_SH=fromRows(COIN_ROWS,{y:'#9a5a08'});

/* ---------- backgrounds ---------- */
function grad(stops){const g=ctx.createLinearGradient(0,0,0,H);stops.forEach(([o,c])=>g.addColorStop(o,c));return g;}
const SKY_TOWN=grad([[0,'#1e1845'],[0.5,'#4b2f6e'],[0.8,'#c8607a'],[1,'#f39a62']]);
const SKY_UNDER=grad([[0,'#0b0f20'],[1,'#1b2444']]);
const SKY_DAY=grad([[0,'#3f97d9'],[0.7,'#9fd6f5'],[1,'#e2f5ff']]);
function seeded(s){return()=>{s=(s*16807)%2147483647;return s/2147483647;};}
const CITY=paint(480,240,r=>{const rnd=seeded(7);let x=0;while(x<480){const w=14+Math.floor(rnd()*26),h=40+Math.floor(rnd()*80);r('#2a2152',x,208-h,w,h+32);for(let wy=208-h+4;wy<204;wy+=6)for(let wx=x+3;wx<x+w-3;wx+=5)if(rnd()<0.18)r('#ffcf6b',wx,wy,2,2);if(rnd()<0.35)r('#2a2152',x+Math.floor(w/2),208-h-8,1,8);x+=w+Math.floor(rnd()*4);}});
const STARS=[];(function(){const rnd=seeded(3);for(let i=0;i<40;i++)STARS.push([Math.floor(rnd()*W),Math.floor(rnd()*90),Math.floor(rnd()*120)]);})();
const UNDERWALL=paint(256,240,r=>{for(let y=0;y<240;y+=12){const off=(y/12)%2?12:0;r('#151c36',0,y,256,1);for(let x=off;x<256;x+=24)r('#151c36',x,y,1,12);}});
const CLOUDS=paint(520,240,(r,x)=>{const rnd=seeded(11);for(let i=0;i<7;i++){const cx=20+i*74+rnd()*20,cy=36+rnd()*70,s=10+rnd()*8;x.fillStyle='#dcefff';[[0,4,s],[s*0.9,2,s*0.8],[-s*0.9,3,s*0.7]].forEach(([dx,dy,rr])=>{x.beginPath();x.arc(cx+dx,cy+dy+2,rr,0,Math.PI*2);x.fill();});x.fillStyle='#ffffff';[[0,0,s],[s*0.9,2,s*0.75],[-s*0.9,3,s*0.65]].forEach(([dx,dy,rr])=>{x.beginPath();x.arc(cx+dx,cy+dy,rr,0,Math.PI*2);x.fill();});}});
const PLANT=paint(600,240,(r,x)=>{x.fillStyle='#a9cbe2';[[80,46],[150,40],[380,50]].forEach(([cx,hw])=>{x.beginPath();x.moveTo(cx-hw,214);x.quadraticCurveTo(cx-hw*0.45,170,cx-hw*0.62,134);x.lineTo(cx+hw*0.62,134);x.quadraticCurveTo(cx+hw*0.45,170,cx+hw,214);x.closePath();x.fill();x.fillStyle='#ffffff';[[0,-6,12],[10,-14,9],[-8,-16,8]].forEach(([dx,dy,rr])=>{x.beginPath();x.arc(cx+dx,134+dy,rr,0,Math.PI*2);x.fill();});x.fillStyle='#a9cbe2';});r('#a9cbe2',250,150,60,64);r('#a9cbe2',470,120,8,94);for(let y=124;y<210;y+=16)r('#d98b84',470,y,8,6);r('#a9cbe2',520,166,50,48);});

function drawBackground(){
  const th=LEVEL.theme;
  if(th==='town'){
    ctx.fillStyle=SKY_TOWN;ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#d9d3ff';
    for(const s of STARS)if(reduceMotion||(frame+s[2])%150<130)ctx.fillRect(s[0],s[1],1,1);
    const sx=300-Math.round(camX*0.02);
    ctx.fillStyle='#ffb86b';ctx.beginPath();ctx.arc(sx,176,28,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#ffd39a';ctx.beginPath();ctx.arc(sx,176,20,0,Math.PI*2);ctx.fill();
    const off=Math.round(camX*0.15)%480;ctx.drawImage(CITY,-off,0);ctx.drawImage(CITY,480-off,0);
    drawPylons();
  }else if(th==='under'){
    ctx.fillStyle=SKY_UNDER;ctx.fillRect(0,0,W,H);
    const o=Math.round(camX*0.25)%256;for(let i=-1;i<3;i++)ctx.drawImage(UNDERWALL,i*256-o,0);
    drawCables();
  }else{
    ctx.fillStyle=SKY_DAY;ctx.fillRect(0,0,W,H);
    const sx=340-Math.round(camX*0.02);ctx.fillStyle='#fff6c8';ctx.beginPath();ctx.arc(sx,44,16,0,Math.PI*2);ctx.fill();
    const po=Math.round(camX*0.08)%600;ctx.drawImage(PLANT,-po,0);ctx.drawImage(PLANT,600-po,0);
    const co=Math.round(camX*0.2+(reduceMotion?0:frame*0.05))%520;ctx.drawImage(CLOUDS,-co,0);ctx.drawImage(CLOUDS,520-co,0);
    drawTurbines();
  }
}
function drawPylons(){
  const po=camX*0.45,sp=180,first=Math.floor(po/sp)-1;
  ctx.strokeStyle='#17132f';ctx.lineWidth=1;let prevX=null;
  for(let i=first;i<first+5;i++){
    const px=Math.round(i*sp-po)+40;drawPylon(px);
    if(prevX!==null){ctx.beginPath();[[108,18,16],[124,14,14]].forEach(([y,arm,sag])=>{ctx.moveTo(prevX+arm,y+1);ctx.quadraticCurveTo((prevX+px)/2,y+1+sag*2,px-arm,y+1);});ctx.moveTo(prevX,94);ctx.quadraticCurveTo((prevX+px)/2,114,px,94);ctx.stroke();}
    prevX=px;
  }
}
function drawPylon(px){
  const base=210,top=96;ctx.beginPath();
  ctx.moveTo(px-11.5,base);ctx.lineTo(px-2.5,top);ctx.lineTo(px+2.5,top);ctx.lineTo(px+11.5,base);
  let left=true;

  flagY=2*T+12;
}
function resetPlayer(tx,form){
  Object.assign(P,{x:tx*T+2,y:0,vx:0,vy:0,w:12,h:14,dir:1,onGround:true,form:0,evoFrom:0,inv:0,coyote:0,jumpBuf:0,anim:0,pit:false,hidden:false,shootCD:0});
  setForm(form||0);P.y=13*T-P.h;
  camX=clampCam(P.x+P.w/2-W*0.42);
}
function setForm(f){const oldH=P.h;P.form=f;P.h=f>0?22:14;P.y+=oldH-P.h;}
function clampCam(v){return Math.max(0,Math.min(COLS*T-W,v));}

/* ---------- physics ---------- */
function isSolid(tx,ty){if(tx<0||tx>=COLS)return true;if(ty<0||ty>=ROWS)return false;return SOLID.has(grid[ty][tx]);}
function moveBody(o,onHead){
  let hitX=false;o.x+=o.vx;
  if(o.vx!==0){const top=Math.floor(o.y/T),bot=Math.floor((o.y+o.h-0.01)/T);
    if(o.vx>0){const tx=Math.floor((o.x+o.w-0.01)/T);for(let ty=top;ty<=bot;ty++)if(isSolid(tx,ty)){o.x=tx*T-o.w;hitX=true;break;}}
    else{const tx=Math.floor(o.x/T);for(let ty=top;ty<=bot;ty++)if(isSolid(tx,ty)){o.x=(tx+1)*T;hitX=true;break;}}}
  o.y+=o.vy;o.onGround=false;
  const l=Math.floor(o.x/T),r=Math.floor((o.x+o.w-0.01)/T);
  if(o.vy>0){const ty=Math.floor((o.y+o.h-0.01)/T);for(let tx=l;tx<=r;tx++)if(isSolid(tx,ty)){o.y=ty*T-o.h;o.vy=0;o.onGround=true;break;}}
  else if(o.vy<0){const ty=Math.floor(o.y/T),hit=[];for(let tx=l;tx<=r;tx++)if(isSolid(tx,ty))hit.push(tx);
    if(hit.length){o.y=(ty+1)*T;o.vy=0;if(onHead){const cx=o.x+o.w/2;let b=hit[0];for(const tx of hit)if(Math.abs(tx*T+8-cx)<Math.abs(b*T+8-cx))b=tx;onHead(b,ty);}}}
  return hitX;
}
const overlap=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;

/* ---------- scoring & events ---------- */
function popup(text,x,y){popups.push({text:String(text),x,y,t:0});}
function addScore(n,x,y){game.score+=n;if(x!==undefined)popup(n,x,y);}
function addCoin(){game.coins++;game.score+=200;sfx.coin();if(game.coins>=100){game.coins-=100;game.lives++;sfx.oneup();popup('1UP',P.x,P.y-10);}}

function bump(tx,ty){
  const c=grid[ty][tx];
  if(c==='Q'){grid[ty][tx]='U';bumps.push({tx,ty,t:0});coinFX.push({x:tx*T+4,y:ty*T-10,vy:-4.2,t:0});addCoin();}
  else if(c==='P'){grid[ty][tx]='U';bumps.push({tx,ty,t:0});items.push({kind:P.form===0?'battery':'core',x:tx*T+2,y:ty*T,w:12,h:14,vx:0,vy:0,rise:16,dead:false,onGround:false});sfx.item();}
  else if(c==='B'){
    if(P.form>=1){grid[ty][tx]='.';game.score+=50;sfx.brk();
      [[-1.2,-5],[1.2,-5],[-1,-3],[1,-3]].forEach(([vx,vy],i)=>particles.push({x:tx*T+(i%2?10:2),y:ty*T+(i<2?2:9),vx,vy,t:0,color:TILE.brickColor,size:4,grav:0.3,life:80}));}
    else{bumps.push({tx,ty,t:0});sfx.bump();}
  }else sfx.bump();
  for(const e of enemies){if(e.dead||e.flip||e.squish||!e.active||e.type==='flyer')continue;const b=e.y+e.h;if(b>=ty*T-3&&b<=ty*T+2&&e.x+e.w>tx*T&&e.x<tx*T+T)kill(e,e.x<tx*T+8?-1:1);}
  if(ty>0&&grid[ty-1][tx]==='o'){grid[ty-1][tx]='.';coinFX.push({x:tx*T+4,y:(ty-1)*T,vy:-4.2,t:0});addCoin();}
}
function bumpOffset(tx,ty){for(const b of bumps)if(b.tx===tx&&b.ty===ty)return -Math.round(Math.sin(b.t/10*Math.PI)*4);return 0;}
function stomp(e){
  game.combo++;const pts=[100,200,400,800,1000,2000,4000,8000][Math.min(game.combo-1,7)];
  addScore(pts,e.x,e.y-6);sfx.stomp();
  if(e.type==='walker')e.squish=30;else{e.flip=true;e.vy=-2;e.vx=0;}
}
function kill(e,dir){e.flip=true;e.vy=-4;e.vx=dir*1;addScore(200,e.x,e.y-6);sfx.kick();}
function evolveTo(f,it){
  addScore(1000,it.x,it.y-6);
  if(f<=P.form){sfx.power();return;}
  P.evoFrom=P.form;setForm(f);game.form=f;state='evolve';evoT=0;sfx.evolve();rumble(220,0.35);
  banner={text:FORM_NAMES[P.evoFrom]+'は '+FORM_NAMES[f]+'に進化した！',t:170};
  burst(P.x+P.w/2,P.y+P.h/2,'#fff36b',10);
}
function hurt(){
  if(P.form>0){const f=P.form-1;setForm(f);game.form=f;P.inv=120;sfx.hurt();rumble(160,0.5);banner={text:FORM_NAMES[f]+'にもどった',t:90};}
  else die();
}
function die(){state='dying';dieT=0;P.pit=false;P.vx=0;P.vy=0;game.form=0;stopMusic();sfx.die();rumble(320,0.9);}

/* ---------- input ---------- */
const keys={left:false,right:false,jump:false,b:false,start:false};
const touch={left:false,right:false,jump:false,b:false};
const prev={jump:false,b:false,start:false,left:false,right:false};
const input={};
let menuTap=false;
/* gamepad (Xbox standard mapping): A=0 B=1 X=2 View=8 Menu=9 D-pad 14/15, left stick axis 0 */
const gpad={left:false,right:false,jump:false,b:false,prevStart:false,connected:false,index:-1};
function getPads(){try{return navigator.getGamepads?Array.from(navigator.getGamepads()):[];}catch(e){return [];}}
function pollPad(){
  gpad.left=gpad.right=gpad.jump=gpad.b=false;let startNow=false,any=false;
  for(const g of getPads()){
    if(!g||!g.connected)continue;any=true;
    const bt=i=>!!(g.buttons[i]&&g.buttons[i].pressed),ax=g.axes[0]||0;
    if(bt(14)||ax<-0.4)gpad.left=true;
    if(bt(15)||ax>0.4)gpad.right=true;
    const nin=isNintendo(g);gpad.nintendo=nin;
    if(bt(0)||(nin&&bt(1)))gpad.jump=true;
    if(nin?(bt(2)||bt(3)):(bt(1)||bt(2)))gpad.b=true;
    if(bt(9)||bt(8))startNow=true;
    if(bt(0)||bt(1)||bt(2)||bt(3)||bt(9))gpad.index=g.index;
  }
  gpad.connected=any;
  const pressed=startNow&&!gpad.prevStart;gpad.prevStart=startNow;return pressed;
}
function rumble(ms,strong){try{const pads=getPads();const g=pads.find(p=>p&&p.index===gpad.index)||pads.find(p=>p&&p.connected);const va=g&&g.vibrationActuator;if(va&&va.playEffect){const r=va.playEffect('dual-rumble',{duration:ms,strongMagnitude:strong,weakMagnitude:strong*0.6});if(r&&r.catch)r.catch(()=>{});}}catch(e){}}
/* Switch Pro Controller / Joy-Con pair: A・B = jump, X・Y = dash, + / − = pause */
function isNintendo(g){return /057e|nintendo|pro controller|joy-con/i.test(g.id||'');}
window.addEventListener('gamepadconnected',e=>{const nin=!!(e&&e.gamepad&&isNintendo(e.gamepad));banner={text:(nin?'Switchの':'')+'コントローラーを接続しました',t:120};});
const KEYMAP={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'jump',KeyW:'jump',Space:'jump',KeyZ:'jump',KeyK:'jump',KeyX:'b',KeyJ:'b',ShiftLeft:'b',ShiftRight:'b',Enter:'start',KeyP:'pause',Escape:'pause'};
window.addEventListener('keydown',e=>{
  const k=KEYMAP[e.code];if(!k)return;
  if(e.target&&e.target.tagName==='BUTTON'&&(e.code==='Space'||e.code==='Enter'))return;
  e.preventDefault();ensureAudio();
  if(k==='pause'){if(!e.repeat)togglePause();return;}
  if(k==='start'&&state==='play'){if(!e.repeat)togglePause();return;}
  keys[k]=true;
});
window.addEventListener('keyup',e=>{const k=KEYMAP[e.code];if(k&&k!=='pause')keys[k]=false;});
window.addEventListener('blur',()=>{for(const k in keys)keys[k]=false;for(const k in touch)touch[k]=false;document.querySelectorAll('.key.on').forEach(b=>b.classList.remove('on'));});
document.querySelectorAll('.key').forEach(btn=>{
  const k=btn.dataset.k;
  const on=e=>{e.preventDefault();ensureAudio();touch[k]=true;btn.classList.add('on');try{btn.setPointerCapture(e.pointerId);}catch(_){}if(paused&&state==='play')togglePause();};
  const off=()=>{touch[k]=false;btn.classList.remove('on');};
  btn.addEventListener('pointerdown',on);btn.addEventListener('pointerup',off);btn.addEventListener('pointercancel',off);btn.addEventListener('lostpointercapture',off);
  btn.addEventListener('contextmenu',e=>e.preventDefault());
});
cvs.addEventListener('pointerdown',e=>{e.preventDefault();ensureAudio();if(paused&&state==='play'){togglePause();return;}menuTap=true;});
const bgmBtn=document.getElementById('bgmBtn'),sfxBtn=document.getElementById('sfxBtn'),pauseBtn=document.getElementById('pauseBtn');
bgmBtn.addEventListener('click',()=>{bgmOn=!bgmOn;ensureAudio();if(musicGain)musicGain.gain.value=bgmOn?0.55:0;bgmBtn.textContent=bgmOn?'BGM：オン':'BGM：オフ';bgmBtn.setAttribute('aria-pressed',String(bgmOn));});
sfxBtn.addEventListener('click',()=>{sfxOn=!sfxOn;ensureAudio();if(sfxGain)sfxGain.gain.value=sfxOn?1:0;sfxBtn.textContent=sfxOn?'効果音：オン':'効果音：オフ';sfxBtn.setAttribute('aria-pressed',String(sfxOn));});
pauseBtn.addEventListener('click',()=>togglePause());
function togglePause(){if(state!=='play'){paused=false;}else{paused=!paused;holdMusic(paused);}pauseBtn.textContent=paused?'再開':'一時停止';}
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(state==='play'&&!paused)togglePause();else holdMusic(true);}else if(!paused)holdMusic(false);});

/* ---------- flow ---------- */
function prepTitle(){loadStage(selStage);buildLevel(3);resetPlayer(3,0);camX=0;}
function toTitle(){saveBest();state='title';titleT=0;paused=false;pauseBtn.textContent='一時停止';selStage=Math.min(selStage,unlocked-1);prepTitle();playMusic('title');}
function newGame(){game=freshGame(selStage);startLife();}
function startLife(){loadStage(game.stage);const tx=game.checkpoint?CHECK_TX:3;buildLevel(tx);resetPlayer(tx,game.form);game.time=300;game.timeAcc=0;game.combo=0;game.hurried=false;banner=null;state='ready';readyT=0;stopMusic();}
function loseLife(){game.lives--;if(game.lives<=0){state='gameover';goT=0;selStage=game.stage;saveBest();sfx.over();}else startLife();}
function nextStage(){
  unlocked=Math.max(unlocked,Math.min(LEVELS.length,game.stage+2));saveBest();
  if(game.stage+1<LEVELS.length){game.stage++;game.checkpoint=false;startLife();}
  else{state='ending';endT=0;playMusic('title');}
}

function step(){
  frame++;
  const padStart=pollPad();
  if(padStart&&state==='play')togglePause();
  if(padStart||(gpad.jump&&!prev.jump))ensureAudio();
  const jumpNow=keys.jump||touch.jump||gpad.jump,bNow=keys.b||touch.b||gpad.b,startNow=keys.start||(padStart&&state!=='play');
  const leftNow=keys.left||touch.left||gpad.left,rightNow=keys.right||touch.right||gpad.right;
  input.left=leftNow;input.right=rightNow;
  input.leftPressed=leftNow&&!prev.left;input.rightPressed=rightNow&&!prev.right;
  input.jump=jumpNow;input.jumpPressed=jumpNow&&!prev.jump;
  input.b=bNow;input.bPressed=bNow&&!prev.b;
  input.startPressed=startNow&&!prev.start;
  prev.jump=jumpNow;prev.b=bNow;prev.start=startNow;prev.left=leftNow;prev.right=rightNow;
  const go=input.jumpPressed||input.startPressed||menuTap;menuTap=false;
  if(banner&&state!=='evolve'&&!paused&&--banner.t<=0)banner=null;
  if(shake>0&&!paused)shake--;
  switch(state){
    case 'title':
      titleT++;
      if(unlocked>1&&input.leftPressed){selStage=(selStage+unlocked-1)%unlocked;prepTitle();}
      if(unlocked>1&&input.rightPressed){selStage=(selStage+1)%unlocked;prepTitle();}
      if(go)newGame();break;
    case 'ready':readyT++;if(readyT>110){state='play';playMusic(LEVEL.music);}break;
    case 'play':if(!paused)updatePlay();break;
    case 'evolve':evoT++;updateFX();if(evoT>=64)state='play';break;
    case 'dying':updateDying();break;
    case 'clear':updateClear();if(clearDone&&go)nextStage();break;
    case 'gameover':goT++;if((goT>60&&go)||goT>300)toTitle();break;
    case 'ending':endT++;if(endT>90&&go)toTitle();break;
  }
}

function updatePlay(){
  updatePlayer();
  {const l=Math.floor(P.x/T),r=Math.floor((P.x+P.w-0.01)/T),t=Math.floor(P.y/T),b=Math.floor((P.y+P.h-0.01)/T);
   for(let ty=Math.max(0,t);ty<=Math.min(ROWS-1,b);ty++)for(let tx=l;tx<=r;tx++)if(tx>=0&&tx<COLS&&grid[ty][tx]==='o'){grid[ty][tx]='.';addCoin();}}
  if(P.x>CHECK_TX*T)game.checkpoint=true;
  if(LEVEL.boss&&!arena.locked&&P.x>(LEVEL.boss.ax+5)*T)startBossFight();
  if(arena.locked){const tx=LEVEL.boss.ax*T;camX+=Math.max(-3,Math.min(3,tx-camX));}
  else camX=clampCam(P.x+P.w/2-W*0.42);
  updateEnemies();if(state!=='play')return;
  updateBoss();if(state!=='play')return;
  updateItems();updateSparks();updateFX();
  if(arena.done&&arena.poleT*3<POLE_SPAN)arena.poleT++;
  const poleX=GOALX*T+7;
  if((!LEVEL.boss||arena.poleT*3>=POLE_SPAN)&&P.x+P.w>=poleX&&P.y<13*T){
    state='clear';clearPhase=0;phaseT=0;clearDone=false;P.x=poleX-P.w;P.vx=0;P.vy=0;game.form=P.form;
    if(LEVEL.boss)openBossGate();
    const h=13*T-(P.y+P.h);const bonus=h>=128?5000:h>=96?2000:h>=64?800:h>=32?400:100;
    addScore(bonus,poleX-6,P.y-10);stopMusic();sfx.clear();return;
  }
  if(++game.timeAcc>=24){game.timeAcc=0;game.time--;
    if(game.time===100&&!game.hurried){game.hurried=true;MUSIC.tempo=1.3;sfx.hurry();}
    if(game.time<=0){game.time=0;die();return;}}
  if(P.y>ROWS*T+4){state='dying';P.pit=true;dieT=60;game.form=0;stopMusic();sfx.die();rumble(320,0.9);}
}

function updatePlayer(){
  const run=input.b,max=run?2.6:1.6,ground=P.onGround,acc=ground?(run?0.1:0.07):0.06;
  if(input.left&&!input.right){P.dir=-1;P.vx-=(P.vx>0&&ground)?0.2:acc;}
  else if(input.right&&!input.left){P.dir=1;P.vx+=(P.vx<0&&ground)?0.2:acc;}
  else if(ground){const d=0.09;if(P.vx>d)P.vx-=d;else if(P.vx<-d)P.vx+=d;else P.vx=0;}
  if(Math.abs(P.vx)>max)P.vx-=Math.sign(P.vx)*0.06;
  P.vx=Math.max(-2.8,Math.min(2.8,P.vx));
  if(input.jumpPressed)P.jumpBuf=7;else if(P.jumpBuf>0)P.jumpBuf--;
  if(ground)P.coyote=6;else if(P.coyote>0)P.coyote--;
  if(P.jumpBuf>0&&P.coyote>0){P.vy=-(5.9+Math.abs(P.vx)*0.25+(P.form===2?0.3:0));P.jumpBuf=0;P.coyote=0;sfx.jump();}
  P.vy=Math.min(P.vy+((input.jump&&P.vy<0)?0.24:0.5),6.5);
  if(moveBody(P,bump))P.vx=0;
  if(P.onGround)game.combo=0;
  P.anim+=Math.abs(P.vx)*0.09;
  if(P.inv>0)P.inv--;
  if(P.shootCD>0)P.shootCD--;
  if(input.bPressed&&P.form===2&&sparks.length<2&&P.shootCD===0){
    sparks.push({x:P.x+(P.dir>0?P.w:-6),y:P.y+8,w:6,h:6,vx:P.dir*4,vy:1,t:0,dead:false,onGround:false});P.shootCD=10;sfx.spark();
  }
}

function updateEnemies(){
  for(const e of enemies){
    if(e.dead)continue;
    if(!e.active){const ex=e.type==='flyer'?e.x0-48:e.x;if(ex<camX+W+32)e.active=true;else continue;}
    if(e.squish>0){if(--e.squish===0)e.dead=true;continue;}
    if(e.flip){e.vy+=0.3;e.x+=e.vx;e.y+=e.vy;if(e.y>H+40)e.dead=true;continue;}
    if(e.type==='flyer'){e.t++;const nx=e.x0+Math.sin(e.t*0.015)*44;e.vx=nx-e.x;e.x=nx;e.y=e.y0+Math.sin(e.t*0.05)*10;e.anim+=0.3;continue;}
    e.vy=Math.min(e.vy+0.35,6);
    if(e.type==='hopper'&&e.onGround){e.vx=0;if(--e.timer<=0){e.vy=-5.2;e.vx=(P.x<e.x?-1:1)*0.9;e.timer=55+(Math.floor(e.x)%30);}}
    if(moveBody(e))e.vx=-e.vx;
    if(e.y>ROWS*T+32)e.dead=true;
    e.anim+=0.08;
  }
  const live=enemies.filter(e=>e.active&&!e.dead&&!e.flip&&!e.squish&&e.type==='walker');
  for(let i=0;i<live.length;i++)for(let j=i+1;j<live.length;j++){const a=live[i],b=live[j];if(overlap(a,b)){if(a.x<b.x){a.vx=-Math.abs(a.vx);b.vx=Math.abs(b.vx);}else{a.vx=Math.abs(a.vx);b.vx=-Math.abs(b.vx);}}}
  for(const e of enemies){
    if(e.dead||!e.active||e.flip||e.squish)continue;
    const hb={x:e.x+1,y:e.y+2,w:e.w-2,h:e.h-2};
    if(!overlap(P,hb))continue;
    const prevBottom=P.y+P.h-P.vy;
    if(P.vy>0&&prevBottom<=hb.y+6){stomp(e);P.vy=input.jump?-6.2:-3.6;P.y=hb.y-P.h;}
    else if(P.inv<=0){hurt();if(state!=='play')return;}
  }
}

function updateItems(){
  for(const it of items){
    if(it.dead)continue;
    if(overlap(P,it)){it.dead=true;if(it.kind==='battery')evolveTo(1,it);else evolveTo(2,it);if(state!=='play')break;continue;}
    if(it.rise>0){it.y-=0.5;it.rise-=0.5;if(it.rise<=0&&it.kind==='battery')it.vx=1;continue;}
    if(it.kind==='core')continue;
    it.vy=Math.min(it.vy+0.35,6);
    if(moveBody(it))it.vx=-it.vx;
    if(it.y>ROWS*T+20)it.dead=true;
  }
  items=items.filter(i=>!i.dead);
}

function burst(x,y,color,n){n=n||6;for(let i=0;i<n;i++){const a=i/n*Math.PI*2;particles.push({x,y,vx:Math.cos(a)*1.4,vy:Math.sin(a)*1.4,t:0,color,size:2,grav:0,life:16});}}
function updateSparks(){
  for(const s of sparks){
    s.t++;s.vy=Math.min(s.vy+0.35,5);
    const hx=moveBody(s);if(s.onGround)s.vy=-3;
    if(hx||s.t>100||s.y>ROWS*T||s.x<camX-16||s.x>camX+W+16){s.dead=true;burst(s.x+3,s.y+3,'#fff36b');continue;}
    for(const e of enemies){if(e.dead||!e.active||e.flip||e.squish)continue;if(overlap(s,e)){kill(e,Math.sign(s.vx));s.dead=true;burst(s.x+3,s.y+3,'#fff36b');break;}}
    if(!s.dead&&boss&&boss.landed&&boss.phase!=='dead'&&overlap(s,boss)){s.dead=true;burst(s.x+3,s.y+3,'#fff36b');if(boss.inv<=0)damageBoss(1,false);else sfx.bump();}
  }
  sparks=sparks.filter(s=>!s.dead);
}
function updateFX(){
  for(const c of coinFX){c.vy+=0.3;c.y+=c.vy;c.t++;if(c.t>=26){c.dead=true;popup(200,c.x-2,c.y);}}
  coinFX=coinFX.filter(c=>!c.dead);
  for(const p of particles){p.vy+=p.grav;p.x+=p.vx;p.y+=p.vy;p.t++;}
  particles=particles.filter(p=>p.t<p.life&&p.y<H+20);
  for(const p of popups){p.t++;p.y-=0.5;}
  popups=popups.filter(p=>p.t<45);
  for(const b of bumps)b.t++;
  bumps=bumps.filter(b=>b.t<10);
}
function updateDying(){
  dieT++;
  if(!P.pit){if(dieT===30)P.vy=-6.5;if(dieT>30){P.vy+=0.3;P.y+=P.vy;}}
  updateFX();
  if(dieT>170)loseLife();
}
function updateClear(){
  phaseT++;updateFX();
  if(clearPhase===0){P.vx=0;P.y+=2;flagY=Math.min(flagY+2,13*T-14);if(P.y+P.h>=13*T){P.y=13*T-P.h;P.onGround=true;clearPhase=1;phaseT=0;}}
  else if(clearPhase===1){flagY=Math.min(flagY+2,13*T-14);if(phaseT>24){clearPhase=2;phaseT=0;P.dir=1;P.x=GOALX*T+10;}}
  else if(clearPhase===2){P.vx=1.2;P.vy=Math.min(P.vy+0.5,6);moveBody(P);P.anim+=0.11;if(P.x+P.w/2>(GOALX+6)*T){P.hidden=true;clearPhase=3;phaseT=0;}}
  camX+=Math.max(-3,Math.min(3,clampCam(P.x+P.w/2-W*0.42)-camX));
  if(clearPhase>=2){
    if(game.time>0){const d=Math.min(2,game.time);game.time-=d;game.score+=d*50;if(frame%4===0)sfx.tick();}
    else if(clearPhase===3&&!clearDone&&phaseT>40){clearDone=true;saveBest();}
  }
}

/* ---------- boss: walk → curl → roll (bounces off the room walls) → dizzy (stomp window) ---------- */
const BOSS_HP=12,BOSS_W=36,BOSS_H=34,BALL=30;
function quake(n){if(!reduceMotion)shake=Math.max(shake,n);}
function startBossFight(){
  const c=LEVEL.boss,a=c.ax;arena.locked=true;
  for(let y=2;y<=12;y++)grid[y][a]='S';
  boss={cfg:c,x:(a+19)*T,y:-50,w:BOSS_W,h:BOSS_H,vx:0,vy:0,dir:-1,onGround:false,phase:'intro',t:0,hp:BOSS_HP,inv:0,anim:0,spin:0,landed:false,air:false,angry:false,rollsLeft:0};
  stopMusic();playMusic('boss');if(game.hurried)MUSIC.tempo=1.3;
  banner={text:c.name+'があらわれた！',t:150};
}
function bossBox(w,h){
  const b=boss,a=b.cfg.ax,cx=b.x+b.w/2,bot=b.y+b.h;
  b.w=w;b.h=h;b.x=Math.max((a+1)*T,Math.min((a+24)*T-w,cx-w/2));b.y=bot-h;
}
function bossPhase(p){
  boss.phase=p;boss.t=0;
  if(p==='curl')bossBox(BALL,BALL);else if(p!=='roll')bossBox(BOSS_W,BOSS_H);
}
function updateBoss(){
  const b=boss;if(!b)return;
  const c=b.cfg,mult=b.angry?1.15:1;
  b.t++;if(b.inv>0)b.inv--;
  switch(b.phase){
    case 'intro':
      b.vy=Math.min(b.vy+0.35,7);moveBody(b);
      if(b.onGround&&!b.landed){b.landed=true;b.t=0;quake(16);sfx.thud();rumble(260,0.8);}
      if(b.landed&&b.t>70)bossPhase('walk');
      break;
    case 'walk':{
      const toP=(P.x+P.w/2)<(b.x+b.w/2)?-1:1;
      if(b.onGround){
        if(b.air){b.air=false;quake(10);sfx.thud();}
        b.dir=toP;b.vx=toP*c.walk*mult;
        if(c.hop&&b.t===45){b.vy=-6.8;b.vx=Math.max(-2.4,Math.min(2.4,(P.x+P.w/2-b.x-b.w/2)/40));b.air=true;sfx.jump();}
      }
      b.vy=Math.min(b.vy+0.35,7);if(moveBody(b))b.vx=0;
      b.anim+=0.12;
      if(b.t>=c.walkT&&b.onGround&&!b.air)bossPhase('curl');
      break;}
    case 'curl':
      b.vx=0;b.vy=Math.min(b.vy+0.35,7);moveBody(b);
      if(b.t>=36){b.dir=(P.x+P.w/2)<(b.x+b.w/2)?-1:1;b.vx=b.dir*c.roll*mult;b.rollsLeft=c.rolls;bossPhase('roll');sfx.brk();}
      break;
    case 'roll':
      b.vy=Math.min(b.vy+0.35,7);
      if(moveBody(b)){
        quake(6);sfx.bump();
        if(b.t>12&&(--b.rollsLeft<=0||b.t>420)){b.vx=0;bossPhase('dizzy');}
        else{b.vx=-b.vx;b.dir=-b.dir;}
      }
      b.spin+=b.vx/15;
      break;
    case 'dizzy':
      b.vx=0;b.vy=Math.min(b.vy+0.35,7);moveBody(b);
      if(b.t>=c.dizzyT)bossPhase('walk');
      break;
    case 'dead':
      b.vy+=0.25;b.x+=b.vx;b.y+=b.vy;
      if(b.y>H+60){boss=null;arena.done=true;arena.poleT=0;sfx.item();playMusic(LEVEL.music);if(game.hurried)MUSIC.tempo=1.3;}
      return;
  }
  bossContact();
}
function bossContact(){
  const b=boss;if(!b||!b.landed||b.phase==='dead')return;
  const hb={x:b.x+3,y:b.y+3,w:b.w-6,h:b.h-3};
  if(!overlap(P,hb))return;
  const prevBottom=P.y+P.h-P.vy;
  if(P.vy>0&&prevBottom<=hb.y+8){
    P.y=hb.y-P.h;
    if(b.phase==='dizzy'){P.vy=input.jump?-6.6:-4.8;damageBoss(4,true);}
    else{P.vy=input.jump?-5.6:-4;sfx.bump();}
    return;
  }
  if(b.phase==='dizzy'||b.inv>30)return;
  if(P.inv<=0)hurt();
}
function damageBoss(n,stomped){
  const b=boss;b.hp-=n;
  addScore(stomped?1000:100,b.x+b.w/2-8,b.y-8);
  if(b.hp<=0){defeatBoss();return;}
  if(stomped){b.inv=70;b.angry=true;sfx.bossHit();quake(8);rumble(180,0.6);bossPhase('walk');}
  else{b.inv=8;sfx.kick();}
}
function defeatBoss(){
  const b=boss;bossPhase('dead');b.vy=-5;b.vx=-b.dir*0.8;b.inv=0;
  addScore(5000,b.x+b.w/2-12,b.y-14);stopMusic();sfx.bossDown();quake(24);rumble(500,1);
  burst(b.x+b.w/2,b.y+b.h/2,'#fff36b',14);
  banner={text:b.cfg.name+'をやっつけた！',t:170};
}

  ctx.restore();
  ell(L.shellH,x+10+jit,y+7,5,2);
  if(b.phase==='curl'&&(b.t>>2)%2)ell('rgba(255,243,107,0.35)',x+15+jit,y+15,15,15);
}
function drawBoss(){
  const b=boss;if(!b)return;
  if(b.phase!=='dead'&&b.inv>8&&(frame>>2)%2)return;
  const L=BOSS_LOOK[b.cfg.kind],x=Math.round(b.x-camX),y=Math.round(b.y);
  if(x<-60||x>W+20)return;
  ctx.save();
  if(b.phase==='dead'){ctx.translate(0,2*y+b.h);ctx.scale(1,-1);}
  if(b.phase==='curl'||b.phase==='roll')drawBossBall(b,L,x,y);
  else{if(b.dir>0){ctx.translate(x+b.w,y);ctx.scale(-1,1);}else ctx.translate(x,y);drawBossBody(b,L);}
  ctx.restore();
  if(b.phase==='dizzy'){const hx=b.dir>0?x+b.w-8:x+8;for(let j=0;j<3;j++){const a=(reduceMotion?0:frame*0.12)+j*2.094;R('#fff36b',Math.round(hx+Math.cos(a)*9)-1,Math.round(y-4+Math.sin(a)*3),3,3);}}
  if(b.inv>0&&b.inv<=8){ctx.globalAlpha=0.5;ell('#ffffff',x+b.w/2,y+b.h/2,b.w/2,b.h/2);ctx.globalAlpha=1;}
}
function drawBossBar(){
  const b=boss;if(!b||!b.landed||b.phase==='dead')return;
  text(b.cfg.name,12,224,'#ff9b7a',8);
  R('#14112a',96,225,122,9);R('#3a2c0e',97,226,120,7);
  R(b.hp<=4?'#ff4a3a':'#ff9b4a',97,226,Math.round(120*Math.max(0,b.hp)/BOSS_HP),7);
}
function drawSparks(){for(const s of sparks){const x=Math.round(s.x-camX),y=Math.round(s.y);if((s.t>>2)%2){R('#fff36b',x+1,y,4,6);R('#fff36b',x,y+1,6,4);}else{R('#fff36b',x+2,y,2,6);R('#fff36b',x,y+2,6,2);R('#fff36b',x+1,y+1,4,4);}R('#ffffff',x+2,y+2,2,2);}}

function drawPlayer(){
  if(P.hidden)return;
  if(state==='play'&&P.inv>0&&(frame>>2)%2)return;
  let fr='idle';
  if(state==='dying'||!P.onGround)fr='jump';
  else if(Math.abs(P.vx)>0.15)fr=(Math.floor(P.anim)%2)?'run1':'run2';
  const f=state==='evolve'?(((evoT>>2)%2)?P.form:P.evoFrom):P.form;
  const img=SPR[f][fr][P.dir>0?1:0];
  const dx=Math.round(P.x-2-camX),dy=Math.round(P.y+P.h-img.height);
  if(state==='dying'&&!P.pit){ctx.save();ctx.translate(0,2*dy+img.height);ctx.scale(1,-1);ctx.drawImage(img,dx,dy);ctx.restore();return;}
  ctx.drawImage(img,dx,dy);
  if(state==='evolve'&&(evoT>>1)%4===0){ctx.globalAlpha=0.6;ctx.globalCompositeOperation='lighter';ctx.drawImage(img,dx,dy);ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;}
  if(P.form===2&&(frame%10)<5){const a=(frame*37)%18,b=(frame*53)%img.height;R('#fff36b',dx-1+a,dy+b);R('#fff36b',dx+17-a,dy+img.height-1-b);}
}
function drawParticles(){for(const p of particles)R(p.color,Math.round(p.x-camX),Math.round(p.y),p.size,p.size);}
function drawPopups(){for(const p of popups)text(p.text,Math.round(p.x-camX),Math.round(p.y),p.text==='1UP'?'#7ee0c3':'#ffffff',6);}

function drawHUD(){
  text(FORM_NAMES[state==='title'?0:(state==='play'||state==='evolve'||state==='clear')?P.form:game.form]+' ×'+game.lives,12,6);
  text(pad(game.score,6),12,16,'#ffffff');
  ctx.drawImage(COIN,128,16,6,8);
  text('×'+pad(game.coins,2),137,16,'#ffffff');
  text('ワールド',224,6);text(LEVEL.id,232,16,'#ffffff');
  text('タイム',336,6);
  if(state!=='title')text(pad(game.time,3),342,16,game.time<=100?'#ff9b7a':'#ffffff');
  if(banner&&state!=='title'){ctx.fillStyle='rgba(13,11,28,0.72)';ctx.fillRect(70,34,260,18);text(banner.text,200,38,'#fff36b',9,'center');}
}
function band(y,h){ctx.fillStyle='rgba(13,11,28,0.8)';ctx.fillRect(40,y,320,h);R('#ffd23f',40,y,320,2);R('#ffd23f',40,y+h-2,320,2);}
function drawTitle(){
  band(40,150);
  text('ピコの電線ラン',200,52,'#ffd23f',22,'center');
  text('でんきの子ピコ、発電所をめざせ！',200,84,'#ece8ff',8,'center');
  const st=LEVELS[selStage].id+'  '+LEVELS[selStage].name;
  text(unlocked>1?'◀  '+st+'  ▶':st,200,102,'#ffffff',10,'center');
  if(reduceMotion||(titleT>>5)%2===0)text('タップ ・ A ・ Space でスタート',200,126,'#7ee0c3',10,'center');
  text('電池でメガ、雷コアでギガに進化',200,150,'#a29ccf',8,'center');
  text('ハイスコア '+pad(best,6),200,166,'#a29ccf',8,'center');
  if(gpad.connected)text(gpad.nintendo?'Switchコントローラー接続中（A・B でスタート）':'コントローラー接続中（A でスタート）',200,177,'#7ee0c3',7,'center');
}
function drawReady(){
  R('#0d0b1c',0,0,W,H);drawHUD();
  text('ワールド '+LEVEL.id,200,76,'#ffffff',12,'center');
  text(LEVEL.name,200,94,'#ffd23f',10,'center');
  const img=SPR[game.form].idle[1];ctx.drawImage(img,168,138-img.height);
  text('×  '+game.lives,192,124,'#ffffff',10);
  if(game.checkpoint)text('チェックポイントから再開',200,158,'#a29ccf',8,'center');
}
function drawGameOver(){
  R('#0d0b1c',0,0,W,H);drawHUD();
  text('ゲームオーバー',200,92,'#ff9b7a',16,'center');
  text('スコア '+pad(game.score,6),200,124,'#ece8ff',8,'center');
  text('タイトルで '+LEVELS[game.stage].id+' から再挑戦できます',200,142,'#a29ccf',8,'center');
}
function drawEnding(){
  R('#0d0b1c',0,0,W,H);
  for(let i=0;i<24;i++){const x=(i*53)%W,y=(i*37)%110+10;if(reduceMotion||(frame+i*9)%90<70)R('#fff36b',x,y);}
  text('オールクリア！',200,52,'#ffd23f',20,'center');
  text('ピコは発電所にたどりつき、町に明かりが戻った',200,84,'#ece8ff',8,'center');
  [0,1,2].forEach(f=>{const img=SPR[f].idle[1];ctx.drawImage(img,150+f*36,142-img.height);});
  text('ピコ   メガ   ギガ',200,146,'#a29ccf',8,'center');
  text('スコア '+pad(game.score,6)+'　ハイスコア '+pad(best,6),200,168,'#ffffff',8,'center');
  if(endT>90&&(reduceMotion||(endT>>5)%2===0))text('タップ ・ Space でタイトルへ',200,196,'#7ee0c3',8,'center');
}
function drawPause(){
  ctx.fillStyle='rgba(13,11,28,0.55)';ctx.fillRect(0,0,W,H);
  text('一時停止',200,98,'#ffffff',16,'center');
  text('P ・ メニューボタン ・ 画面タップで再開',200,126,'#a29ccf',8,'center');
}
function drawClear(){
  band(70,96);
  text(LEVEL.id+' クリア！',200,82,'#ffd23f',16,'center');
  text('スコア '+pad(game.score,6)+'　ハイスコア '+pad(Math.max(best,game.score),6),200,112,'#ece8ff',8,'center');
  const last=game.stage+1>=LEVELS.length;
  if(reduceMotion||(phaseT>>5)%2===0)text(last?'タップ ・ Space でエンディングへ':'タップ ・ Space で次のステージへ',200,136,'#7ee0c3',8,'center');
}
function render(){
  resetTransform();
  if(shake>0&&!paused)ctx.translate(0,(shake>>1)%2?2:-2);
  if(state==='ready'){drawReady();return;}
  if(state==='gameover'){drawGameOver();return;}
  if(state==='ending'){drawEnding();return;}
  drawBackground();drawBuilding();drawGoal();drawItems();drawTiles();drawEnemies();drawBoss();drawSparks();
  for(const c of coinFX)drawCoinAt(Math.round(c.x-camX),Math.round(c.y),c.t*0.5);
  drawPlayer();drawParticles();drawPopups();drawHUD();drawBossBar();
  if(state==='title')drawTitle();
  if(paused&&state==='play')drawPause();
  if(state==='clear'&&clearDone)drawClear();
}

/* ---------- loop ---------- */
let last=performance.now(),acc=0;const STEP=1000/60;
function loop(now){acc+=Math.min(100,now-last);last=now;while(acc>=STEP){step();acc-=STEP;}render();requestAnimationFrame(loop);}
function start(data){
  if(data&&typeof data.best==='number'&&data.best>best)best=data.best;
  if(data&&typeof data.unlocked==='number')unlocked=Math.max(unlocked,Math.min(LEVELS.length,data.unlocked));
  toTitle();
  if(document.fonts&&document.fonts.load)document.fonts.load('16px "DotGothic16"').catch(()=>{});
  requestAnimationFrame(t=>{last=t;loop(t);});
}
if(window.__PICO_TEST)window.__pico={step,render,get state(){return state;},set state(v){state=v;},P,get game(){return game;},keys,loadStage,startLife,get LEVEL(){return LEVEL;},get enemies(){return enemies;},get items(){return items;},get boss(){return boss;},get arena(){return arena;},get camX(){return camX;},get grid(){return grid;},setSel:v=>{selStage=v;}};
try{window.claude&&window.claude.hot&&window.claude.hot.snapshot&&window.claude.hot.snapshot(()=>({best,unlocked}));}catch(e){}
const hot=window.claude&&window.claude.hot;
if(hot&&hot.ready)hot.ready(start);else start((hot&&hot.data)||{});
})();
</script>
